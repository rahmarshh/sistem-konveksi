<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produksi Konveksi — Sistem Terpadu</title>
<style>
:root{--navy:#071a36;--blue:#1557d5;--bg:#f4f7fc;--ink:#17243b;--muted:#66748b;--line:#e2e8f0;--green:#16834a;--red:#c63d48}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#eef2f8;color:#23324b;border:1px solid #d7deea}button.outline{background:white;color:var(--blue);border:1px solid #a9c2f7}button.good{background:#16834a}button.warn{background:#b87912}button:disabled{opacity:.45;cursor:not-allowed}
.app{display:flex;min-height:100vh}.side{width:225px;background:linear-gradient(180deg,#06152c,#0b2347);color:#eaf1ff;padding:22px 13px;flex-shrink:0}.brand{font-size:17px;font-weight:800;padding:4px 12px 30px;display:flex;gap:10px;align-items:center}.brand i{color:#4d8aff;font-style:normal;font-size:25px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#d5e0f4;text-align:left;font-weight:500;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#1557d5;color:white}.nav span{font-size:18px;width:20px}.main{min-width:0;flex:1}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.top strong{font-size:14px}.top .role{background:#edf3ff;color:#1b55bc;padding:8px 12px;border-radius:30px;font-weight:700}.content{padding:26px;max-width:1600px;margin:auto}.page-title{font-size:25px;margin:0 0 20px;letter-spacing:-.5px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #0b1c3b05}.stat{display:flex;gap:14px;align-items:center}.stat .bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#eaf1ff;color:var(--blue);font-size:21px}.stat small{display:block;color:var(--muted);margin-bottom:4px}.stat b{font-size:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2,.card h2{font-size:17px;margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f5}th{background:#f7f9fc;color:#53627a;font-size:12px;font-weight:750}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e8f1ff;color:#215bc1;font-weight:700;font-size:12px}.badge.green{background:#e4f7eb;color:#16834a}.badge.yellow{background:#fff3d2;color:#95600a}.badge.purple{background:#f0e9ff;color:#7444b5}.badge.red{background:#ffe8e9;color:#b52f3a}.btn-danger{background:#fff0f0;color:#b52f3a;border:1px solid #f2b9bd}.btn-danger:hover{background:#ffe1e3}.row-actions{display:flex;gap:7px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.filters button{background:white;color:#40506a;border:1px solid var(--line)}.filters button.active{background:var(--blue);color:white;border-color:var(--blue)}.search{max-width:420px;width:100%}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d7dfeb;border-radius:9px;background:white;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#6794f2;box-shadow:0 0 0 3px #1557d51a}label{display:block;font-weight:650;font-size:13px;margin-bottom:7px}.field{margin-bottom:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sizes label{text-align:center}.sizes input{text-align:center}.summary{background:#edf4ff;color:#1754b7;border-radius:10px;padding:13px;font-weight:750;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:white}.login-left{padding:8vh 9%;max-width:800px;width:100%;margin:auto}.login-right{background:linear-gradient(145deg,#06152c,#0c2b58);color:white;padding:9%;display:flex;flex-direction:column;justify-content:space-between}.login-right h2{font-size:clamp(28px,4vw,48px);line-height:1.25}.login .brand{color:var(--navy);padding:0 0 40px}.role-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.role-picker button{background:white;color:#34445e;border:1px solid #d8e0eb;padding:15px 7px}.role-picker button.selected{border:2px solid var(--blue);background:#eff5ff;color:var(--blue)}.login h1{font-size:30px;margin:0 0 7px}.login .muted{margin:0}.login .primary{width:100%;margin-top:8px}.notice{padding:12px;background:#fff5db;color:#815a0b;border-radius:9px;margin:12px 0;font-size:13px}.modal-back{position:fixed;inset:0;background:#06152c66;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:16px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #00112c44}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0;font-size:20px}.close{background:#eef2f8;color:#34445e;padding:7px 11px}.empty{text-align:center;padding:30px;color:var(--muted)}.chart{display:flex;align-items:end;gap:15px;height:210px;padding:12px 10px 0}.bar{flex:1;background:linear-gradient(#4b88f1,#1557d5);border-radius:7px 7px 0 0;position:relative;min-width:16px}.bar span{position:absolute;top:-23px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}.chart-labels{display:flex;gap:15px;padding:8px 10px}.chart-labels span{flex:1;text-align:center;color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.progress{height:9px;background:#edf1f7;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.toast{position:fixed;right:22px;bottom:22px;background:#10223f;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 8px 30px #0003;z-index:20}.small{font-size:12px}.print-only{display:none}
@media(max-width:1000px){.side{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:18px}.form-grid,.split{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.side{width:100%;padding:10px}.brand{padding:6px 10px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.top{padding:0 15px}.content{padding:14px}.stats{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px}.stat .bubble{display:none}.stat b{font-size:20px}.page-title{font-size:21px}.login{grid-template-columns:1fr}.login-right{display:none}.login-left{padding:35px 22px}.role-picker{gap:5px}.role-picker button{font-size:12px}.form-grid{grid-template-columns:1fr}.sizes{gap:5px}.sizes input{padding:9px 4px}}
@media print{.side,.top,.no-print,button{display:none!important}.content{padding:0}.card{box-shadow:none;border:1px solid #ddd}.print-only{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
const seed=[
{id:'ORD-2611-001',spk:'SPK-2611-001',customer:'PT Maju Bersama',product:'Kemeja PDH',fabric:'American Drill',pcs:80,sizes:[10,25,30,15,0],payment:'Lunas',total:12000000,dp:6000000,due:'2026-11-28',stage:'Cutting',qcPass:0,qcReject:0},
{id:'ORD-2611-002',spk:'SPK-2611-002',customer:'CV Sejahtera Abadi',product:'Kaos Combed',fabric:'Cotton Combed',pcs:150,sizes:[20,40,50,30,10],payment:'DP 50%',total:15000000,dp:7500000,due:'2026-11-30',stage:'Sewing',qcPass:0,qcReject:0},
{id:'ORD-2611-003',spk:'SPK-2611-003',customer:'UD Karya Utama',product:'Jaket Bomber',fabric:'Taslan',pcs:60,sizes:[5,15,20,15,5],payment:'DP 50%',total:18000000,dp:9000000,due:'2026-12-02',stage:'QC',qcPass:58,qcReject:2},
{id:'ORD-2611-004',spk:'SPK-2611-004',customer:'PT Sukses Mandiri',product:'Polo Shirt',fabric:'Lacoste',pcs:100,sizes:[10,30,30,20,10],payment:'DP 50%',total:10000000,dp:5000000,due:'2026-12-04',stage:'Packing',qcPass:0,qcReject:0},
{id:'ORD-2611-005',spk:'SPK-2611-005',customer:'CV Mitra Sejati',product:'Celana Kerja',fabric:'Drill',pcs:120,sizes:[10,30,40,30,10],payment:'Lunas',total:14000000,dp:14000000,due:'2026-12-05',stage:'Selesai',qcPass:120,qcReject:0}
];
let orders=JSON.parse(localStorage.getItem('konveksi-orders')||'null')||seed;
let role='Admin Konveksi',page='Dashboard',selectedRole='Koordinator Produksi & QC',search='',filter='Semua',editing=null;
const root=document.querySelector('#root');
const roles=['Admin Konveksi','Koordinator Produksi & QC','Pemilik Usaha'];
const stages=['Antrean','Cutting','Sewing','QC','Packing','Selesai'];
const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const totalPcs=o=>Number(o.sizes?.reduce((a,b)=>a+Number(b||0),0)||o.pcs||0);
function save(){localStorage.setItem('konveksi-orders',JSON.stringify(orders))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(t){let cls=t==='Lunas'||t==='Selesai'?'green':t==='Dibatalkan'?'red':t==='QC'?'yellow':t==='Sewing'?'purple':t==='Packing'?'green':t==='Antrean'?'yellow':'';return `<span class="badge ${cls}">${esc(t)}</span>`}
function btn(text,fn,cl=''){return `<button class="${cl}" onclick="${fn}">${text}</button>`}
function cardStat(label,val,icon='▣'){return `<div class="card stat"><div class="bubble">${icon}</div><div><small>${label}</small><b>${val}</b></div></div>`}
function tableRows(list,kind='admin'){if(!list.length)return '<tr><td colspan="8" class="empty">Belum ada data yang cocok.</td></tr>';return list.map(function(o){let action=kind==='admin'?'<button class="outline" onclick="openSpk(\''+o.id+'\')">SPK</button>'+(o.cancelled?'<button class="btn-danger" onclick="deleteOrder(\''+o.id+'\')">Hapus</button>':'<button class="btn-danger" onclick="cancelOrder(\''+o.id+'\')">Batalkan</button>'):'<button class="outline" onclick="openUpdate(\''+o.id+'\')">Update</button>';return '<tr><td><b>'+esc(o.spk||'Belum terbit')+'</b><div class="small muted">'+esc(o.id)+'</div></td><td>'+esc(o.customer)+'</td><td>'+esc(o.product)+'<div class="small muted">'+totalPcs(o)+' pcs</div></td><td>'+fmtDate(o.due)+'</td><td>'+badge(o.cancelled?'Dibatalkan':o.stage)+'</td><td>'+esc(o.payment)+'</td><td><div class="row-actions">'+action+'</div></td></tr>'}).join('')}
function fmtDate(s){if(!s)return '-';return new Date(s+'T12:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function chooseRole(r){selectedRole=r;login()}
function login(){
  const roleButtons=roles.map(r=>`<button type="button" class="${r===selectedRole?'selected':''}" data-role="${r}" onclick="chooseRole(this.dataset.role)">${r}</button>`).join('');
  const username=selectedRole==='Koordinator Produksi & QC'?'KRD-01':selectedRole==='Admin Konveksi'?'ADM-01':'OWN-01';
  root.innerHTML=`<div class="login"><section class="login-left"><div class="brand"><i>♧</i> KONVEKSI</div><h1>Pemesanan & Produksi Konveksi</h1><p class="muted">Silakan pilih peran pengguna untuk masuk ke sistem</p><div class="role-picker">${roleButtons}</div><form onsubmit="loginSubmit(event)"><div class="field"><label>Username / ID Pegawai</label><input id="username" value="${username}" required></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Masukkan password" required></div><div class="notice">Demo: isi username dan password apa saja untuk masuk.</div><button type="submit" class="primary">Masuk Sistem</button></form></section><aside class="login-right"><div><div class="small">SISTEM TERPADU</div><h2>Pemesanan, SPK, dan Monitoring Produksi</h2></div><div class="small">Produksi Konveksi • Prototype interaktif</div></aside></div>`;
}
function loginSubmit(e){
  e.preventDefault();
  const username=document.querySelector('#username')?.value.trim();
  const password=document.querySelector('#password')?.value;
  if(!username||!password){alert('Username dan password wajib diisi.');return;}
  role=selectedRole;
  page=role==='Pemilik Usaha'?'Analitik Pimpinan':'Dashboard';
  search='';filter='Semua';
  render();
}

function navItems(){return role==='Admin Konveksi'?['Dashboard','Input Pesanan','SPK','Cek Status Produksi']:role==='Koordinator Produksi & QC'?['Dashboard','Monitoring','Update & Hasil']:['Analitik Pimpinan','Laporan','Pantau Antrean SPK']}
function sidebar(){let links="";navItems().forEach(function(n,i){links += "<button class=\""+(page===n?"active":"")+"\" data-page=\""+n+"\" onclick=\"go(this.dataset.page)\"><span>"+["⌂","▤","▧","▥"][i%4]+"</span>"+n+"</button>"});return "<aside class=\"side\"><div class=\"brand\"><i>♧</i> Produksi Konveksi</div><div class=\"nav\">"+links+"<button onclick=\"login()\" style=\"margin-top:18px\"><span>↪</span>Keluar</button></div></aside>"}
function shell(content){root.innerHTML=`<div class="app">${sidebar()}<main class="main"><header class="top"><strong>☰ &nbsp; Produksi Konveksi</strong><span class="role">● ${role}</span></header><div class="content">${content}</div></main></div>`}
function dashboardAdmin(){let active=orders.filter(o=>!o.cancelled),unpaid=active.filter(o=>o.payment!=='Lunas').length;return `<h1 class="page-title">Dashboard</h1><div class="grid stats">${cardStat('Pesanan Aktif',active.length,'🛒')}${cardStat('SPK Belum Dicetak',active.filter(o=>!o.spk).length,'▤')}${cardStat('Menunggu Pelunasan DP',unpaid,'▣')}${cardStat('Total Transaksi Bulan Ini',rupiah(active.reduce((a,o)=>a+o.total,0)),'▥')}</div><div class="card"><div class="section-head"><h2>Pesanan Terbaru & Status SPK</h2>${btn('＋ Input Pesanan',"go('Input Pesanan')")}</div><div class="table-wrap"><table><thead><tr><th>No. Pesanan / SPK</th><th>Nama Pelanggan</th><th>Jenis Pakaian</th><th>Tenggat</th><th>Status Produksi</th><th>Pembayaran</th><th>Aksi</th></tr></thead><tbody>${tableRows(orders.slice().reverse())}</tbody></table></div></div>`}
function orderForm(){return `<h1 class="page-title">Form Input Pesanan Baru</h1><form onsubmit="saveOrder(event)"><div class="form-grid"><div class="card"><h2>Data Pelanggan & Spesifikasi</h2><div class="field"><label>Nama Pelanggan</label><input name="customer" required placeholder="Nama pelanggan/perusahaan"></div><div class="field"><label>No. WhatsApp</label><input name="phone" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Alamat Pelanggan</label><textarea name="address" rows="2" placeholder="Alamat lengkap"></textarea></div><div class="field"><label>Jenis Pakaian</label><select name="product"><option>Kemeja PDH</option><option>Kaos Combed</option><option>Jaket Bomber</option><option>Polo Shirt</option><option>Celana Kerja</option><option>Hoodie</option></select></div><div class="field"><label>Jenis Kain</label><select name="fabric"><option>American Drill</option><option>Cotton Combed</option><option>Taslan</option><option>Lacoste</option><option>Drill</option></select></div><div class="field"><label>Batas Waktu Selesai</label><input type="date" name="due" required value="2026-11-28"></div></div><div class="card"><h2>Rincian Ukuran (Size Breakdown) & Biaya</h2><div class="sizes" style="margin:15px 0">${['S','M','L','XL','XXL'].map((s,i)=>`<div><label>${s}</label><input name="size${i}" type="number" min="0" value="${[10,25,30,15,0][i]}" oninput="calcTotal(this.form)"></div>`).join('')}</div><div class="field"><label>Catatan Pola</label><textarea name="notes" rows="3" placeholder="Contoh: bordir logo dada kiri"></textarea></div><div class="summary">Total Pesanan: <span id="pcs">80</span> Pcs</div><div class="form-grid"><div class="field"><label>Total Biaya (Rp)</label><input name="total" type="number" min="0" value="12000000" oninput="calcDp(this.form)"></div><div class="field"><label>Nominal DP (Rp)</label><input name="dp" type="number" min="0" value="6000000"></div></div><div class="field"><label>Status Pembayaran</label><select name="payment"><option>DP 50%</option><option>Lunas</option><option>Belum Bayar</option></select></div><div class="actions"><button type="button" class="secondary" onclick="validateOrder()">Validasi Pesanan</button><button>Simpan & Lanjut Terbitkan SPK</button></div><p id="validation" class="small muted"></p></div></div></form>`}
function calcTotal(f){let n=[0,1,2,3,4].reduce((a,i)=>a+Number(f['size'+i].value||0),0);document.querySelector('#pcs').textContent=n}
function calcDp(f){f.dp.value=Math.round(Number(f.total.value||0)/2)}
function validateOrder(){let f=document.querySelector('form');let n=[0,1,2,3,4].reduce((a,i)=>a+Number(f['size'+i].value||0),0);document.querySelector('#validation').textContent=n>0?`Valid: jumlah ${n} pcs. Periksa data sebelum menyimpan.`:'Jumlah ukuran harus lebih dari 0.'}
function saveOrder(e){e.preventDefault();let f=e.target,d=new FormData(f),sizes=[0,1,2,3,4].map(i=>Number(d.get('size'+i)||0)),pcs=sizes.reduce((a,b)=>a+b,0);if(!pcs){alert('Isi jumlah ukuran terlebih dahulu.');return}let seq=String(orders.length+1).padStart(3,'0'),id='ORD-2611-'+seq;let o={id,spk:'SPK-2611-'+seq,customer:d.get('customer'),phone:d.get('phone'),address:d.get('address'),product:d.get('product'),fabric:d.get('fabric'),due:d.get('due'),sizes,pcs,total:Number(d.get('total')),dp:Number(d.get('dp')),payment:d.get('payment'),notes:d.get('notes'),stage:'Antrean',qcPass:0,qcReject:0};orders.push(o);save();editing=o.id;go('SPK');toast('Pesanan tersimpan dan SPK dibuat.')}
function spkPage(){let available=orders.filter(x=>!x.cancelled);let q=search.toLowerCase();let matches=available.filter(x=>(x.id+' '+x.spk+' '+x.customer+' '+x.product).toLowerCase().includes(q));let o=available.find(x=>x.id===editing)||matches[0]||available[0];if(!available.length)return `<h1 class="page-title">Penerbitan SPK Digital & Alokasi Kain</h1><div class="card empty">Belum ada pesanan aktif untuk dibuatkan SPK.</div>`;return `<h1 class="page-title">Penerbitan SPK Digital & Alokasi Kain</h1><div class="card" style="margin-bottom:16px"><div class="section-head"><h2>Cari & Pilih Pesanan</h2><button class="secondary" onclick="search='';refreshTable()">Reset</button></div><input class="search" placeholder="Cari No. SPK, No. Pesanan, Nama Pelanggan, atau Produk..." value="${esc(search)}" oninput="search=this.value;refreshTable()"><div class="filters">${matches.map(x=>`<button class="${o.id===x.id?'active':''}" onclick="editing='${x.id}';render()">${esc(x.spk||x.id)} · ${esc(x.customer)}</button>`).join('')||'<span class="muted small">Tidak ada pesanan yang cocok.</span>'}</div></div>${o?`<div class="split"><div class="card" id="spk-print"><h2 style="text-align:center;margin:5px 0 20px">SURAT PERINTAH KERJA (SPK)</h2><p><b>SPK Number:</b> ${esc(o.spk||'Belum diterbitkan')}</p><p><b>Order Ref:</b> ${esc(o.id)}</p><p><b>Customer:</b> ${esc(o.customer)}</p><p><b>Item:</b> ${esc(o.product)} — ${esc(o.fabric)}</p><table><thead><tr><th>Ukuran</th><th>Jumlah (Pcs)</th></tr></thead><tbody>${['S','M','L','XL','XXL'].map((z,i)=>`<tr><td>${z}</td><td>${o.sizes[i]||0}</td></tr>`).join('')}<tr><th>Total</th><th>${totalPcs(o)} Pcs</th></tr></tbody></table><p style="margin-top:18px"><b>Estimasi Kebutuhan Kain:</b> 120 Meter</p><p><b>Penanggung Jawab:</b> Koordinator Produksi</p></div><div class="card"><h2>Validasi Kain & Notifikasi</h2><div class="summary">✓ Pesanan aktif dipilih</div><div class="field"><label>Estimasi Kain (Meter)</label><input id="meter" type="number" value="120"></div><div class="actions">${btn('▣ Cetak Dokumen SPK (PDF)','window.print()')}${btn('Kirim Invoice & Status ke WhatsApp','sendWhatsApp()','good')}</div><p class="small muted">Pilih pesanan melalui kolom pencarian di atas. Pesanan yang dibatalkan tidak ditampilkan.</p></div></div>`:''}`}
function statusPage(){let list=orders.filter(o=>(o.id+' '+o.spk+' '+o.customer+' '+o.product).toLowerCase().includes(search.toLowerCase())&&(filter==='Semua'||(filter==='Dibatalkan'?o.cancelled:!o.cancelled&&o.stage===filter)));return `<h1 class="page-title">Cek Status Produksi & Info Pelanggan</h1><div class="card"><div class="section-head"><input class="search" placeholder="Cari No. SPK, No. Pesanan, atau Nama Pelanggan..." value="${esc(search)}" oninput="search=this.value;refreshTable()"><button class="secondary" onclick="search='';refreshTable()">Reset</button></div><div class="filters">${['Semua',...stages,'Dibatalkan'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';refreshTable()">${f}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>No. SPK / Pesanan</th><th>Nama Pelanggan</th><th>Produk & Total</th><th>Tenggat</th><th>Pos Produksi</th><th>Pembayaran</th><th>Aksi</th></tr></thead><tbody id="order-rows">${tableRows(list)}</tbody></table></div></div>`}
function coordinatorDash(){let count=s=>orders.filter(o=>!o.cancelled&&o.stage===s).length;return `<h1 class="page-title">Dashboard Produksi</h1><div class="grid stats">${cardStat('Antrean Cutting',count('Cutting')+' SPK','✂')}${cardStat('Proses Sewing',count('Sewing')+' SPK','⚙')}${cardStat('Antrean Inspeksi QC',count('QC')+' SPK','⌕')}${cardStat('Siap Packing',count('Packing')+' SPK','▧')}</div><div class="card"><div class="section-head"><h2>Antrean SPK Aktif Lantai Produksi</h2>${btn('Monitoring',"go('Monitoring')")}</div><input class="search" placeholder="Cari No. SPK, Nama Pelanggan, atau Produk..." value="${esc(search)}" oninput="search=this.value;refreshTable()"><div class="table-wrap"><table><thead><tr><th>No. SPK</th><th>Jenis Pakaian</th><th>Tenggat</th><th>Pos Saat Ini</th><th>Aksi</th></tr></thead><tbody>${orders.filter(o=>!o.cancelled&&o.stage!=='Selesai'&&(o.spk+' '+o.id+' '+o.customer+' '+o.product).toLowerCase().includes(search.toLowerCase())).map(o=>`<tr><td>${o.spk}</td><td>${esc(o.product)} (${totalPcs(o)} pcs)</td><td>${fmtDate(o.due)}</td><td>${badge(o.stage)}</td><td>${btn('Update Pos / QC',`openUpdate('${o.id}')`,'outline')}</td></tr>`).join('')}</tbody></table></div></div>`}
function monitoringPage(){let q=search.toLowerCase();let list=orders.filter(o=>(o.spk+' '+o.id+' '+o.customer+' '+o.product).toLowerCase().includes(q)&&(filter==='Semua'||(filter==='Dibatalkan'?o.cancelled:!o.cancelled&&o.stage===filter)));return `<h1 class="page-title">${page==='Update & Hasil'?'Update Posisi Kerja & Hasil QC':'Monitoring Posisi Kerja & Progres Produksi'}</h1><div class="card"><div class="section-head"><h2>Daftar SPK & Hasil Produksi</h2><button class="secondary" onclick="search='';filter='Semua';refreshTable()">Reset Pencarian</button></div><input class="search" placeholder="Cari No. SPK, No. Pesanan, Nama Pelanggan, atau Produk..." value="${esc(search)}" oninput="search=this.value;refreshTable()"><div class="filters">${['Semua',...stages,'Dibatalkan'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';refreshTable()">${f}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>No. SPK</th><th>Pelanggan</th><th>Produk & Total</th><th>Tenggat</th><th>Pos Kerja Terkini</th><th>Hasil QC</th><th>Aksi</th></tr></thead><tbody>${list.length?list.map(o=>`<tr><td>${esc(o.spk||'-')}<div class="small muted">${esc(o.id)}</div></td><td>${esc(o.customer)}</td><td>${esc(o.product)}<br>${totalPcs(o)} pcs</td><td>${fmtDate(o.due)}</td><td>${badge(o.cancelled?'Dibatalkan':o.stage)}</td><td>${o.qcPass||0} lolos / ${o.qcReject||0} rijek</td><td>${o.cancelled?'<span class="muted small">Tidak dapat diupdate</span>':btn('Update Pos / Input QC',`openUpdate('${o.id}')`,'outline')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Tidak ada pesanan yang cocok dengan pencarian.</td></tr>'}</tbody></table></div></div>`}
function ownerDash(){let done=orders.filter(o=>o.stage==='Selesai').length;return `<h1 class="page-title">Dashboard Analitik & Evaluasi Pimpinan</h1><div class="grid stats">${cardStat('Ketepatan Waktu Produksi','92%','◉')}${cardStat('Rasio Cacat Produksi','3,76%','◉')}${cardStat('Total SPK Aktif',orders.filter(o=>o.stage!=='Selesai').length,'▤')}${cardStat('Selesai Bulan Ini',done,'🏆')}</div><div class="split"><div class="card"><h2>Tren Volume Produksi 6 Bulan Terakhir</h2><div class="chart">${[7.2,8.4,9.1,10.2,8.7,9.3].map(n=>`<div class="bar" style="height:${n*15}px"><span>${n}K</span></div>`).join('')}</div><div class="chart-labels">${['Jun','Jul','Agu','Sep','Okt','Nov'].map(m=>`<span>${m}</span>`).join('')}</div></div><div class="card"><h2>Rekomendasi Prioritas SPK</h2><div class="notice">⚠ Periksa pesanan yang mendekati tenggat.</div><p>Kapasitas lini jahit perlu dipantau secara berkala.</p><p>Prioritaskan inspeksi QC untuk pesanan yang berada pada tahap QC.</p>${btn('Pantau Antrean SPK',"go('Pantau Antrean SPK')")}</div></div>`}
function reportPage(){return `<h1 class="page-title">Laporan Rekapitulasi Produksi & Pemesanan Bulanan</h1><div class="card"><div class="section-head"><div><label>Periode</label><select style="width:auto"><option>November 2026</option><option>Desember 2026</option></select></div><div class="actions no-print">${btn('Cetak Laporan','window.print()','outline')}${btn('Ekspor CSV','exportCsv()')}</div></div><div class="table-wrap"><table><thead><tr><th>No. SPK</th><th>Jenis Pakaian</th><th>Total Pcs</th><th>Lolos QC</th><th>Rijek QC</th><th>Status SPK</th><th>Total Pendapatan</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${o.spk}</td><td>${esc(o.product)}</td><td>${totalPcs(o)}</td><td>${o.qcPass||0}</td><td>${o.qcReject||0}</td><td>${badge(o.stage)}</td><td>${rupiah(o.total)}</td></tr>`).join('')}</tbody></table></div><div class="summary">Total: ${orders.reduce((a,o)=>a+totalPcs(o),0).toLocaleString('id-ID')} Pcs &nbsp; | &nbsp; Pendapatan: ${rupiah(orders.reduce((a,o)=>a+o.total,0))}</div></div>`}
function ownerQueue(){return `<h1 class="page-title">Pantau Antrean SPK & Status Produksi</h1><div class="grid stats">${cardStat('Total SPK Aktif',orders.filter(o=>o.stage!=='Selesai').length,'▤')}${cardStat('Berjalan Normal',orders.filter(o=>o.stage!=='Selesai').length,'✓')}${cardStat('Mendekati Deadline H-3',orders.filter(o=>o.stage!=='Selesai').length?1:0,'◷')}${cardStat('Selesai Bulan Ini',orders.filter(o=>o.stage==='Selesai').length,'🏆')}</div><div class="card"><h2>Daftar Antrean SPK Aktif</h2><div class="table-wrap"><table><thead><tr><th>No. SPK</th><th>Pelanggan</th><th>Jenis Pakaian</th><th>Total Pcs</th><th>Tenggat Waktu</th><th>Pos & Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${o.spk}</td><td>${esc(o.customer)}</td><td>${esc(o.product)}</td><td>${totalPcs(o)}</td><td>${fmtDate(o.due)}</td><td>${badge(o.stage)}</td></tr>`).join('')}</tbody></table></div></div>`}
function go(p){page=p;search='';filter='Semua';render()}
function render(){if(page==='Input Pesanan'){shell(orderForm());return}let content=page==='Dashboard'?(role==='Admin Konveksi'?dashboardAdmin():coordinatorDash()):page==='SPK'?spkPage():page==='Cek Status Produksi'?statusPage():page==='Monitoring'?monitoringPage():page==='Update & Hasil'?monitoringPage():page==='Analitik Pimpinan'?ownerDash():page==='Laporan'?reportPage():ownerQueue();shell(content)}
function refreshTable(){let input=document.querySelector('.search');let pos=input?.selectionStart;render();let next=document.querySelector('.search');if(next){next.focus();next.setSelectionRange(pos,pos)}}
function openSpk(id){editing=id;go('SPK')}
function sendWhatsApp(){let o=orders.find(x=>x.id===editing);if(!o)return;let text=`Halo ${o.customer}, pesanan ${o.id} (${o.product}, ${totalPcs(o)} pcs) telah dicatat. Status: ${o.stage}. Tenggat: ${fmtDate(o.due)}.`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
function cancelOrder(id){let o=orders.find(x=>x.id===id);if(!o||o.cancelled)return;document.querySelector('#modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Batalkan Pesanan</h2><button class="close" onclick="closeModal()">✕</button></div><div class="notice">Pesanan <b>${esc(o.id)}</b> — ${esc(o.customer)} akan ditandai sebagai dibatalkan. Data tetap tersimpan di riwayat.</div><form onsubmit="confirmCancel(event,'${o.id}')"><div class="field"><label>Alasan pembatalan</label><textarea name="reason" rows="3" required placeholder="Contoh: pelanggan membatalkan pesanan"></textarea></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Kembali</button><button class="btn-danger">Ya, Batalkan Pesanan</button></div></form></div></div>`} 
function confirmCancel(e,id){e.preventDefault();let o=orders.find(x=>x.id===id);if(!o)return;o.cancelled=true;o.cancelReason=new FormData(e.target).get('reason');o.cancelledAt=new Date().toISOString();o.stage='Dibatalkan';save();closeModal();render();toast('Pesanan berhasil dibatalkan dan disimpan di riwayat.')} 
function deleteOrder(id){let o=orders.find(x=>x.id===id);if(!o||!o.cancelled)return;if(!confirm(`Hapus permanen pesanan ${o.id}? Tindakan ini tidak bisa dibatalkan.`))return;orders=orders.filter(x=>x.id!==id);save();render();toast('Data pesanan dihapus permanen.')} 
function openUpdate(id){let o=orders.find(x=>x.id===id);if(!o||o.cancelled)return;editing=id;document.querySelector('#modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Update Pos Kerja & Input Hasil QC</h2><button class="close" onclick="closeModal()">✕</button></div><div class="summary">No. SPK: ${o.spk} | Produk: ${esc(o.product)} (${totalPcs(o)} pcs) | Pelanggan: ${esc(o.customer)}</div><form onsubmit="saveUpdate(event)"><div class="field"><label>Tahapan Pos Kerja</label><select name="stage">${stages.map(s=>`<option ${s===o.stage?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Jumlah Lolos QC (Pcs)</label><input name="pass" type="number" min="0" value="${o.qcPass||0}"></div><div class="field"><label>Jumlah Rijek / Rework (Pcs)</label><input name="reject" type="number" min="0" value="${o.qcReject||0}"></div></div><div class="field"><label>Keterangan Rijek / Catatan Deviasi</label><textarea name="note" rows="3" placeholder="Catatan hasil pemeriksaan">${esc(o.note||'')}</textarea></div><div class="field"><label>Petugas Pencatat</label><input value="${role}" readonly></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Batal</button><button class="good">Simpan Log Progres</button></div></form></div></div>`}
function saveUpdate(e){e.preventDefault();let d=new FormData(e.target),o=orders.find(x=>x.id===editing);o.stage=d.get('stage');o.qcPass=Number(d.get('pass')||0);o.qcReject=Number(d.get('reject')||0);o.note=d.get('note');o.updated=new Date().toISOString();save();closeModal();render();toast('Log progres berhasil disimpan.')}
function closeModal(){document.querySelector('#modal-root').innerHTML=''}
function exportCsv(){let rows=[['No SPK','Pelanggan','Produk','Total Pcs','Lolos QC','Rijek QC','Status','Pendapatan'],...orders.map(o=>[o.spk,o.customer,o.product,totalPcs(o),o.qcPass||0,o.qcReject||0,o.stage,o.total])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='laporan-konveksi.csv';a.click();URL.revokeObjectURL(a.href)}
function toast(msg){let el=document.querySelector('#toast-root');el.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>el.innerHTML='',2600)}
login();
</script>
</body></html>
